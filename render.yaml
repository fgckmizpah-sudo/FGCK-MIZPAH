# Render manifest for Mizpah Management
# Replace <GITHUB_REPO> and <BRANCH> if you want automatic linking.
# After committing this file, connect your GitHub repo in Render and create services.

services:
  - type: web
    name: mizpah-server
    env: node
    plan: starter
    branch: main # change if needed
    buildCommand: "npm --prefix server install"
    startCommand: "npm --prefix server start"

  - type: static
    name: mizpah-client
    plan: free
    branch: main # change if needed
    buildCommand: "npm --prefix client install && npm --prefix client run build"
    publishPath: client/dist

# Notes:
# - Render-managed Postgres requires billing information and is not available for fully free deployment.
# - For a free shared database across devices, use an external Postgres provider such as Neon.
# - In the `mizpah-server` service environment variables, set:
#   - DATABASE_URL to the Neon Postgres connection string
#   - JWT_SECRET to a secure key
#   - NODE_ENV=production
# - In the `mizpah-client` service environment variables, set:
#   - VITE_API_BASE_URL=https://<mizpah-server>.onrender.com/api
# - Commit and push this file to your repo; Render will detect and can auto-deploy.
